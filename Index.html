<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enablement Operations Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f3;
    --bg-tertiary: #eeede8;
    --text-primary: #1a1a18;
    --text-secondary: #6b6b67;
    --border-light: rgba(0,0,0,0.1);
    --border-mid: rgba(0,0,0,0.18);
    --radius-md: 8px;
    --radius-lg: 12px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1c;
      --bg-secondary: #2a2a27;
      --bg-tertiary: #333330;
      --text-primary: #f0efe9;
      --text-secondary: #9a9a94;
      --border-light: rgba(255,255,255,0.08);
      --border-mid: rgba(255,255,255,0.15);
    }
  }
  body { font-family: var(--font); background: var(--bg-tertiary); color: var(--text-primary); min-height: 100vh; padding: 1.5rem; }
  .container { max-width: 1400px; margin: 0 auto; }
  .dash-header { padding-bottom: 1rem; border-bottom: 0.5px solid var(--border-light); margin-bottom: 1rem; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .dash-title { font-size: 20px; font-weight: 600; color: var(--text-primary); }
  .dash-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type=text], .toolbar select {
    font-size: 13px; padding: 7px 11px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border-mid); background: var(--bg-primary);
    color: var(--text-primary); outline: none;
  }
  .toolbar input[type=text] { width: 200px; }
  .toolbar input[type=text]:focus, .toolbar select:focus { border-color: #378ADD; }
  .btn-add {
    font-size: 13px; padding: 7px 16px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border-mid); background: var(--bg-primary);
    color: var(--text-primary); cursor: pointer; white-space: nowrap; font-family: var(--font);
  }
  .btn-add:hover { background: var(--bg-secondary); }
  .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .stat { background: var(--bg-primary); border-radius: var(--radius-md); padding: 0.85rem 1rem; border: 0.5px solid var(--border-light); }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
  .stat-value { font-size: 24px; font-weight: 600; color: var(--text-primary); }
  .table-wrap { overflow-x: auto; border: 0.5px solid var(--border-light); border-radius: var(--radius-lg); background: var(--bg-primary); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 960px; }
  thead th {
    background: var(--bg-secondary); padding: 10px 12px; text-align: left;
    font-weight: 500; font-size: 12px; color: var(--text-secondary);
    border-bottom: 0.5px solid var(--border-light); white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  thead th:hover { color: var(--text-primary); }
  tbody tr { border-bottom: 0.5px solid var(--border-light); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg-secondary); }
  tbody td { padding: 9px 12px; color: var(--text-primary); vertical-align: middle; }
  .editable {
    cursor: text; min-height: 20px; display: block; border-radius: 4px;
    padding: 2px 5px; outline: none; min-width: 40px;
  }
  .editable:hover { background: var(--bg-secondary); outline: 0.5px solid var(--border-mid); }
  .editable:focus { outline: 1px solid #378ADD; background: var(--bg-primary); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge-go { background: #EAF3DE; color: #3B6D11; }
  .badge-nogo { background: #FCEBEB; color: #A32D2D; }
  .badge-pending { background: #FAEEDA; color: #854F0B; }
  .badge-tbd { background: #F1EFE8; color: #5F5E5A; }
  .badge-sent { background: #EAF3DE; color: #3B6D11; }
  .badge-notsent { background: #FCEBEB; color: #A32D2D; }
  .score-bar { display: flex; align-items: center; gap: 7px; }
  .score-track { flex: 1; height: 5px; background: var(--border-light); border-radius: 99px; overflow: hidden; min-width: 50px; }
  .score-fill { height: 100%; border-radius: 99px; transition: width 0.3s; }
  .score-num { font-size: 12px; font-weight: 500; color: var(--text-secondary); min-width: 26px; text-align: right; }
  .inline-select {
    font-size: 12px; border: 0.5px solid var(--border-mid); border-radius: 4px;
    background: var(--bg-primary); color: var(--text-primary); padding: 3px 5px;
    width: 100%; font-family: var(--font); outline: none;
  }
  .inline-select:focus { border-color: #378ADD; }
  .btn-delete {
    background: none; border: none; cursor: pointer; color: var(--text-secondary);
    font-size: 14px; padding: 3px 6px; border-radius: 4px; font-family: var(--font);
  }
  .btn-delete:hover { background: #FCEBEB; color: #A32D2D; }
  .empty-row td { text-align: center; padding: 2.5rem; color: var(--text-secondary); font-size: 13px; }
  .btn-export {
    font-size: 13px; padding: 7px 16px; border-radius: var(--radius-md);
    border: 0.5px solid #378ADD; background: #E6F1FB; color: #185FA5;
    cursor: pointer; white-space: nowrap; font-family: var(--font); font-weight: 500;
  }
  .btn-export:hover { background: #B5D4F4; }
</style>
</head>
<body>
<div class="container">
  <div class="dash-header">
    <div>
      <div class="dash-title">Enablement operations dashboard</div>
      <div class="dash-subtitle">Track sessions, readiness scores, and go/no-go status</div>
    </div>
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search topics..." oninput="renderTable()">
      <select id="filter-gng" onchange="renderTable()">
        <option value="">All statuses</option>
        <option value="Go">Go</option>
        <option value="No Go">No Go</option>
        <option value="Pending">Pending</option>
        <option value="TBD">TBD</option>
      </select>
      <button class="btn-add" onclick="addRow()">+ Add session</button>
      <button class="btn-export" onclick="exportCSV()">Export CSV</button>
    </div>
  </div>

  <div class="summary-bar" id="summary-bar"></div>

  <div class="table-wrap">
    <table id="main-table">
      <thead>
        <tr>
          <th style="width:120px" onclick="sortBy('topic')">Topic ↕</th>
          <th style="width:160px">Description</th>
          <th style="width:80px" onclick="sortBy('pm')">PM ↕</th>
          <th style="width:90px" onclick="sortBy('type')">Type ↕</th>
          <th style="width:90px" onclick="sortBy('ga')">GA date ↕</th>
          <th style="width:100px" onclick="sortBy('enablementDate')">Enablement date ↕</th>
          <th style="width:100px" onclick="sortBy('readinessScore')">Readiness score ↕</th>
          <th style="width:90px" onclick="sortBy('goNoGo')">Go/no go ↕</th>
          <th style="width:90px" onclick="sortBy('inviteSent')">Invite sent ↕</th>
          <th style="width:130px">Comments</th>
          <th style="width:36px"></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<script>
let rows = JSON.parse(localStorage.getItem('enablement_rows') || '[]');
let sortKey = null, sortDir = 1, nextId = rows.length ? Math.max(...rows.map(r=>r.id))+1 : 1;

function save() { localStorage.setItem('enablement_rows', JSON.stringify(rows)); }

function addRow() {
  rows.push({ id: nextId++, topic:'', description:'', pm:'', type:'', ga:'', enablementDate:'', readinessScore:'', goNoGo:'TBD', inviteSent:'No', comments:'' });
  save(); renderTable();
}

function deleteRow(id) { rows = rows.filter(r => r.id !== id); save(); renderTable(); }

function updateField(id, field, value) {
  const row = rows.find(r => r.id === id);
  if (row) { row[field] = value; save(); renderSummary(); }
}

function sortBy(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  renderTable();
}

function scoreBar(val) {
  const n = parseInt(val) || 0;
  const pct = Math.min(100, Math.max(0, n));
  const color = pct >= 70 ? '#639922' : pct >= 40 ? '#BA7517' : '#E24B4A';
  return `<div class="score-bar"><div class="score-track"><div class="score-fill" style="width:${pct}%;background:${color}"></div></div><span class="score-num">${n}</span></div>`;
}

function editableCell(id, field, value, type='text') {
  if (type === 'select-gng') {
    return `<select class="inline-select" onchange="updateField(${id},'${field}',this.value);renderTable()">${['TBD','Pending','Go','No Go'].map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select>`;
  }
  if (type === 'select-invite') {
    return `<select class="inline-select" onchange="updateField(${id},'${field}',this.value);renderTable()">${['No','Yes'].map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select>`;
  }
  return `<span class="editable" contenteditable="true" onblur="updateField(${id},'${field}',this.innerText.trim())" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${value||''}</span>`;
}

function renderSummary() {
  const total = rows.length;
  const go = rows.filter(r => r.goNoGo === 'Go').length;
  const nogo = rows.filter(r => r.goNoGo === 'No Go').length;
  const sent = rows.filter(r => r.inviteSent === 'Yes').length;
  const scores = rows.map(r => parseInt(r.readinessScore)).filter(n => !isNaN(n));
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : '-';
  document.getElementById('summary-bar').innerHTML = [
    ['Total sessions', total], ['Go', go], ['No go', nogo], ['Invites sent', sent], ['Avg readiness', avg]
  ].map(([l,v]) => `<div class="stat"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`).join('');
}

function renderTable() {
  renderSummary();
  const search = document.getElementById('search').value.toLowerCase();
  const filterGng = document.getElementById('filter-gng').value;
  let filtered = rows.filter(r => {
    const matchSearch = !search || [r.topic,r.description,r.pm,r.type].some(v=>(v||'').toLowerCase().includes(search));
    const matchGng = !filterGng || r.goNoGo === filterGng;
    return matchSearch && matchGng;
  });
  if (sortKey) {
    filtered.sort((a,b) => {
      const av=(a[sortKey]||'').toString().toLowerCase(), bv=(b[sortKey]||'').toString().toLowerCase();
      return av<bv?-sortDir:av>bv?sortDir:0;
    });
  }
  const tbody = document.getElementById('table-body');
  if (!filtered.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="11">${rows.length===0?'No sessions yet — click "+ Add session" to get started':'No results match your filters'}</td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(r => `<tr>
    <td>${editableCell(r.id,'topic',r.topic)}</td>
    <td>${editableCell(r.id,'description',r.description)}</td>
    <td>${editableCell(r.id,'pm',r.pm)}</td>
    <td>${editableCell(r.id,'type',r.type)}</td>
    <td>${editableCell(r.id,'ga',r.ga)}</td>
    <td>${editableCell(r.id,'enablementDate',r.enablementDate)}</td>
    <td>${r.readinessScore!==''?scoreBar(r.readinessScore)+'<span style="display:none">'+r.readinessScore+'</span>':editableCell(r.id,'readinessScore',r.readinessScore)}</td>
    <td>${editableCell(r.id,'goNoGo',r.goNoGo,'select-gng')}</td>
    <td>${editableCell(r.id,'inviteSent',r.inviteSent,'select-invite')}</td>
    <td>${editableCell(r.id,'comments',r.comments)}</td>
    <td><button class="btn-delete" onclick="deleteRow(${r.id})" title="Delete">✕</button></td>
  </tr>`).join('');
}

function exportCSV() {
  const headers = ['Topic','Description','PM','Type','GA Date','Enablement Date','Readiness Score','Go/No Go','Invite Sent','Comments'];
  const csvRows = [headers.join(','), ...rows.map(r =>
    [r.topic,r.description,r.pm,r.type,r.ga,r.enablementDate,r.readinessScore,r.goNoGo,r.inviteSent,r.comments]
    .map(v => `"${(v||'').replace(/"/g,'""')}"`)
    .join(',')
  )];
  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'enablement_ops_dashboard.csv'; a.click();
}

renderTable();
</script>
</body>
</html>
